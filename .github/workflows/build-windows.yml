name: Build Medialab-Shutdown Timer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        shell: pwsh
        run: npm install --legacy-peer-deps

      - name: Verify Tauri files
        shell: pwsh
        run: |
          $required = @(
            "src-tauri/tauri.conf.json",
            "src-tauri/Cargo.toml",
            "src-tauri/build.rs",
            "src-tauri/src/main.rs",
            "src-tauri/icons/icon.ico"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Missing required file: $file"
            }
          }

          Write-Host "All Tauri files are present."

      - name: Build Tauri Windows application
        shell: pwsh
        run: npm exec tauri build

      - name: Verify installers
        shell: pwsh
        run: |
          Write-Host "Checking generated installers..."

          $exe = Get-ChildItem `
            "src-tauri/target/release/bundle/nsis/*.exe" `
            -ErrorAction SilentlyContinue

          $msi = Get-ChildItem `
            "src-tauri/target/release/bundle/msi/*.msi" `
            -ErrorAction SilentlyContinue

          if (-not $exe) {
            throw "NSIS EXE was not generated."
          }

          if (-not $msi) {
            throw "MSI installer was not generated."
          }

          Write-Host "EXE:"
          $exe | ForEach-Object {
            Write-Host $_.FullName
          }

          Write-Host "MSI:"
          $msi | ForEach-Object {
            Write-Host $_.FullName
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Medialab-Shutdown-Timer-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

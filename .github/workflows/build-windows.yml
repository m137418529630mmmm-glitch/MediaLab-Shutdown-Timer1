name: Build Medialab-Shutdown Timer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE and MSI
    runs-on: windows-latest

    steps:

      # -------------------------------------------------------
      # 1. Download repository
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # 2. Node.js
      # IMPORTANT:
      # No npm cache here because this project has bun.lock
      # and does not have package-lock.json.
      # -------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # -------------------------------------------------------
      # 3. Rust
      # -------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc


      # -------------------------------------------------------
      # 4. Install Rust dependencies / Windows target
      # -------------------------------------------------------
      - name: Verify Rust
        shell: pwsh
        run: |
          rustc --version
          cargo --version


      # -------------------------------------------------------
      # 5. Verify project structure
      # -------------------------------------------------------
      - name: Verify project
        shell: pwsh
        run: |
          Write-Host "Checking project files..."

          $requiredFiles = @(
            "package.json",
            "vite.config.ts",
            "src/App.tsx",
            "src/main.tsx",
            "src-tauri/tauri.conf.json",
            "src-tauri/Cargo.toml",
            "src-tauri/build.rs",
            "src-tauri/src/main.rs",
            "src-tauri/icons/icon.ico",
            "src/utils/native.ts"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Host ""
              Write-Host "MISSING FILE: $file" -ForegroundColor Red
              Write-Host ""
              exit 1
            }

            Write-Host "[OK] $file" -ForegroundColor Green
          }

          Write-Host ""
          Write-Host "Project structure is OK." -ForegroundColor Green


      # -------------------------------------------------------
      # 6. Install npm dependencies
      #
      # IMPORTANT:
      # The project does NOT have package-lock.json.
      # legacy-peer-deps avoids the Vite/esbuild peer conflict.
      # -------------------------------------------------------
      - name: Install npm dependencies
        shell: pwsh
        run: |
          npm install --legacy-peer-deps


      # -------------------------------------------------------
      # 7. Install Tauri CLI locally
      #
      # This makes sure `npm exec tauri` works even if the
      # package was not already installed in node_modules.
      # -------------------------------------------------------
      - name: Install Tauri CLI
        shell: pwsh
        run: |
          npm install --save-dev @tauri-apps/cli@latest --legacy-peer-deps


      # -------------------------------------------------------
      # 8. Check Tauri configuration
      # -------------------------------------------------------
      - name: Check Tauri configuration
        shell: pwsh
        run: |
          Write-Host "===== tauri.conf.json ====="
          Get-Content "src-tauri/tauri.conf.json"

          Write-Host ""
          Write-Host "===== Cargo.toml ====="
          Get-Content "src-tauri/Cargo.toml"


      # -------------------------------------------------------
      # 9. Build frontend
      # -------------------------------------------------------
      - name: Build frontend
        shell: pwsh
        run: |
          npm run build


      # -------------------------------------------------------
      # 10. Build Tauri Windows application
      # -------------------------------------------------------
      - name: Build Tauri application
        shell: pwsh
        run: |
          npm exec tauri build


      # -------------------------------------------------------
      # 11. Show generated files
      # -------------------------------------------------------
      - name: Show build output
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "===== RELEASE DIRECTORY ====="

          if (Test-Path "src-tauri/target/release") {
            Get-ChildItem `
              "src-tauri/target/release" `
              -Recurse `
              -File |
              Select-Object FullName, Length |
              Format-Table -AutoSize
          }
          else {
            Write-Host "Release directory was not created." -ForegroundColor Red
            exit 1
          }


      # -------------------------------------------------------
      # 12. Verify EXE
      # -------------------------------------------------------
      - name: Verify EXE installer
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem `
            "src-tauri/target/release/bundle/nsis" `
            -Filter "*.exe" `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $exeFiles) {
            Write-Host "NSIS EXE was NOT generated." -ForegroundColor Red
            exit 1
          }

          Write-Host ""
          Write-Host "EXE generated successfully:" -ForegroundColor Green

          foreach ($file in $exeFiles) {
            Write-Host $file.FullName
          }


      # -------------------------------------------------------
      # 13. Verify MSI
      # -------------------------------------------------------
      - name: Verify MSI installer
        shell: pwsh
        run: |
          $msiFiles = Get-ChildItem `
            "src-tauri/target/release/bundle/msi" `
            -Filter "*.msi" `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $msiFiles) {
            Write-Host "MSI was NOT generated." -ForegroundColor Red
            exit 1
          }

          Write-Host ""
          Write-Host "MSI generated successfully:" -ForegroundColor Green

          foreach ($file in $msiFiles) {
            Write-Host $file.FullName
          }


      # -------------------------------------------------------
      # 14. Upload EXE + MSI
      # -------------------------------------------------------
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Medialab-Shutdown-Timer-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
